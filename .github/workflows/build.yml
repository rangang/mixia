name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web-github:
    name: Build Web (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-web
      - run: flutter pub get
      - run: flutter build web --release --base-href /mixia/
      
      - name: Package Web (GitHub Pages)
        run: |
          cd build/web
          zip -r ../../密匣_Web_GitHubPages.zip .
      
      - uses: actions/upload-artifact@v4
        with:
          name: web-github-package
          path: 密匣_Web_GitHubPages.zip
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

  build-web-vercel:
    name: Build Web (Vercel/Root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-web
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      
      - name: Copy vercel.json
        run: cp vercel.json build/web/
      
      - name: Package Web (Vercel)
        run: |
          cd build/web
          zip -r ../../密匣_Web_Vercel.zip .
      
      - uses: actions/upload-artifact@v4
        with:
          name: web-vercel-package
          path: 密匣_Web_Vercel.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-android
      - run: flutter pub get
      - run: flutter build apk --release
      
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk 密匣_Android.apk
      
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: 密匣_Android.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      
      - name: Package Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 密匣_Windows.zip
        shell: powershell
      
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: 密匣_Windows.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      
      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../密匣_macOS.zip 密匣.app
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: 密匣_macOS.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev zip
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      
      - name: Package Linux
        run: |
          cd build/linux/x64/release
          tar -czvf ../../../../密匣_Linux.tar.gz bundle/
      
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: 密匣_Linux.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web-github, build-web-vercel, build-android, build-windows, build-macos, build-linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
      
      - name: List downloaded files
        run: ls -la packages/*/
      
      - name: Determine release tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
          else
            TAG_NAME="v1.0.0-dev"
            IS_PRERELEASE="true"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Create/update tag for dev release
        if: steps.meta.outputs.prerelease == 'true'
        run: |
          git tag -f ${{ steps.meta.outputs.tag }} ${{ steps.meta.outputs.sha }}
          git push -f origin ${{ steps.meta.outputs.tag }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 密匣 MiXia ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.sha }})
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body: |
            ## 密匣 (MiXia) - 零后端跨平台密码管理器
            
            > Commit: `${{ steps.meta.outputs.sha }}`
            > ${{ steps.meta.outputs.prerelease == 'true' && '⚠️ 这是开发预览版本' || '✅ 这是正式发布版本' }}
            
            ### 支持平台
            - 🌐 **Web在线体验(GitHub Pages)**: https://rangang.github.io/mixia/
            - 🌐 **Web部署包(Vercel/自定义域名)**: 下载 `密匣_Web_Vercel.zip` 解压后部署到Vercel/Netlify等平台
            - 🪟 **Windows**: 下载 `密匣_Windows.zip` 解压运行 mi_xia.exe
            - 🍎 **macOS**: 下载 `密匣_macOS.zip` 解压后将密匣.app拖入应用程序文件夹
            - 🐧 **Linux**: 下载 `密匣_Linux.tar.gz` 解压后运行 bundle/mi_xia
            - 📱 **Android**: 下载 `密匣_Android.apk` 安装
            
            ### Web部署说明
            - **Vercel部署**: 下载 `密匣_Web_Vercel.zip`，解压后在Vercel中导入该文件夹作为静态站点，已内置`vercel.json`SPA路由配置
            - **GitHub Pages**: 访问 https://rangang.github.io/mixia/ 即可
            - **其他静态托管**: 同样使用 `密匣_Web_Vercel.zip` 版本
            
            ### 功能特性
            - 🔐 10种条目类型（登录、银行卡、安全笔记、身份信息、邮箱、Wi-Fi、服务器、软件许可证、数据库、SSH密钥）
            - 🧬 生物识别快速解锁 (Touch ID/Face ID)
            - ☁️ WebDAV私有云同步（坚果云、Nextcloud、群晖NAS等）
            - 📤 加密备份与恢复
            - 🎲 内置密码生成器
            - 💻 全平台响应式设计
          files: |
            packages/web-github-package/密匣_Web_GitHubPages.zip
            packages/web-vercel-package/密匣_Web_Vercel.zip
            packages/android-package/密匣_Android.apk
            packages/windows-package/密匣_Windows.zip
            packages/macos-package/密匣_macOS.zip
            packages/linux-package/密匣_Linux.tar.gz
