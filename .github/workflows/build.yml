name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-web
      - run: flutter pub get
      - run: flutter build web --release --base-href ./
      
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 密匣_Web
          path: build/web
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-android
      - run: flutter pub get
      - run: flutter build apk --release
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: 密匣_Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      
      - name: Package Windows
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 密匣_Windows.zip
        shell: powershell
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 密匣_Windows
          path: build/windows/x64/runner/Release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      
      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../密匣_macOS.zip 密匣.app
      
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 密匣_macOS
          path: build/macos/Build/Products/Release/密匣.app

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      
      - name: Package Linux
        run: |
          cd build/linux/x64/release
          tar -czvf ../../../../密匣_Linux.tar.gz bundle/
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 密匣_Linux
          path: build/linux/x64/release/bundle
