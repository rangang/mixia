name: mi_xia
description: "密匣 - 零后端存储 · 生物识别认证 · 私有云同步的跨平台密码管理工具"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.2
  convert: ^3.1.2
  http: ^1.2.1
  path_provider: ^2.1.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.5.2

flutter:
  uses-material-design: true

  assets:
    - creative-doc/assets/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: creative-doc/_shared/fonts/BricolageGrotesque-Regular.ttf
        - asset: creative-doc/_shared/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: creative-doc/_shared/fonts/JetBrainsMono-Regular.ttf
        - asset: creative-doc/_shared/fonts/JetBrainsMono-Bold.ttf
          weight: 700
